    <!-- GitHub Pages SPA: restore path from redirect query param -->
    <script>
      (function() {
        var params = new URLSearchParams(window.location.search);
        var p = params.get('p');
        if (p != null) {
          var q = params.get('q');
          var hash = window.location.hash;
          var newUrl = window.location.pathname + (p ? '/' + p.replace(/~and~/g, '&') : '') +
            (q ? '?' + q.replace(/~and~/g, '&') : '') + hash;
          window.history.replaceState(null, null, newUrl);
        }
      })();
    </script>

    <!-- Catch load errors BEFORE the module script runs -->
    <script>
      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          var url = e.target.src || e.target.href || '';
          // If browser has a stale/dev index.html (references /src/ instead of built assets),
          // force a hard reload with a cache-busting param — once only to avoid loops.
          if ((url.indexOf('/src/') !== -1 || url.indexOf('main.jsx') !== -1) &&
              !sessionStorage.getItem('hard_reload')) {
            sessionStorage.setItem('hard_reload', '1');
            window.location.replace(window.location.pathname + '?v=' + Date.now());
            return;
          }
          // Also auto-reload stale hashed chunks (built assets that no longer exist)
          if (url.indexOf('/assets/') !== -1 && !sessionStorage.getItem('hard_reload')) {
            sessionStorage.setItem('hard_reload', '1');
            window.location.replace(window.location.pathname + '?v=' + Date.now());
            return;
          }
          var fb = document.getElementById('loading-fallback');
          if (fb) {
            fb.innerHTML =
              '<div class="icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 10 4.553-2.069A1 1 0 0 1 21 8.871V15.13a1 1 0 0 1-1.447.899L15 14M3 8a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2 2H3V8z"/></svg></div>' +
              '<p>Error al cargar la aplicación</p>' +
              '<div class="err">No se pudo cargar: ' + url + '</div>' +
              '<button onclick="sessionStorage.clear();location.reload()">Recargar página</button>';
          }
        }
      }, true);
    </script>
